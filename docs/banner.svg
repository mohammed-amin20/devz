<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="devZ — Ask. Answer. Grow.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1514"/>
      <stop offset="0.55" stop-color="#101A1A"/>
      <stop offset="1" stop-color="#0B1212"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00BCD4"/>
      <stop offset="1" stop-color="#44D8F1"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44D8F1"/>
      <stop offset="1" stop-color="#00687A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#44D8F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#44D8F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2A2A" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base + texture -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1080" cy="40" r="320" fill="url(#glow)"/>
  <circle cx="70" cy="300" r="240" fill="url(#glow)" opacity="0.5"/>

  <!-- Decorative code brackets on the right -->
  <g fill="none" stroke="url(#stroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M1050 110 L1010 160 L1050 210"/>
    <path d="M1170 110 L1210 160 L1170 210"/>
  </g>
  <circle cx="1110" cy="160" r="6" fill="#44D8F1" opacity="0.7"/>
  <circle cx="1110" cy="120" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="1110" cy="200" r="4" fill="#FFD700" opacity="0.5"/>

  <!-- Logo mark -->
  <g>
    <rect x="88" y="88" width="144" height="144" rx="34" fill="#13201F" stroke="url(#stroke)" stroke-width="3"/>
    <text x="160" y="192" text-anchor="middle"
          font-family="'Space Grotesk','Segoe UI',Arial,sans-serif"
          font-size="86" font-weight="700" fill="url(#cyan)">Z</text>
    <text x="108" y="192" text-anchor="middle"
          font-family="'Consolas','SFMono-Regular',monospace"
          font-size="42" font-weight="700" fill="#2E7C86">&#60;</text>
    <text x="212" y="192" text-anchor="middle"
          font-family="'Consolas','SFMono-Regular',monospace"
          font-size="42" font-weight="700" fill="#2E7C86">&#62;</text>
  </g>

  <!-- Wordmark -->
  <text x="272" y="170"
        font-family="'Space Grotesk','Segoe UI',Arial,sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2">
    <tspan fill="#EAF6F6">dev</tspan><tspan fill="url(#cyan)">Z</tspan>
  </text>

  <!-- Tagline -->
  <text x="276" y="220"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="600" fill="#9FBDBD">Ask. Answer. Grow.</text>

  <!-- Tech chips -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">
    <g>
      <rect x="276" y="248" width="92" height="34" rx="17" fill="#13201F" stroke="#24494E"/>
      <text x="322" y="270" text-anchor="middle" fill="#BFDADB">Kotlin</text>
    </g>
    <g>
      <rect x="378" y="248" width="118" height="34" rx="17" fill="#13201F" stroke="#24494E"/>
      <text x="437" y="270" text-anchor="middle" fill="#BFDADB">Compose</text>
    </g>
    <g>
      <rect x="506" y="248" width="120" height="34" rx="17" fill="#13201F" stroke="#24494E"/>
      <text x="566" y="270" text-anchor="middle" fill="#BFDADB">Supabase</text>
    </g>
    <g>
      <rect x="636" y="248" width="150" height="34" rx="17" fill="#13201F" stroke="#24494E"/>
      <text x="711" y="270" text-anchor="middle" fill="#BFDADB">Firebase FCM</text>
    </g>
  </g>
</svg>
